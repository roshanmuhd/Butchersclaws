<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Butcher's Claw Machine</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#04122b;color:#fff;font-family:system-ui,Arial,sans-serif;color-scheme:dark}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#0c3a7a,#04122b 70%)}
.hide{display:none!important}
.card{width:min(92vw,480px);background:#0a2a5c;border:3px solid #19b8f0;border-radius:24px;padding:22px;box-shadow:0 12px 40px #0008;text-align:center}
h1{margin:0 0 6px;font-size:clamp(22px,4vw,30px);letter-spacing:.5px}
p{margin:6px 0 14px;color:#cfe3ff}
label{display:block;text-align:left;font-size:14px;margin:10px 0 4px;color:#9fd8ff}
input,select{width:100%;padding:14px;border-radius:12px;border:2px solid #2b5da3;background:#06214a;color:#fff;font-size:18px;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:8px}.row select{width:42%}
.chk{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:14px;margin:14px 0}.chk input{width:26px;height:26px;flex:none}
.btn{width:100%;padding:16px;border:0;border-radius:16px;background:#e0312b;color:#fff;font-size:22px;font-weight:900;letter-spacing:1px;box-shadow:0 5px 0 #8f1410;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8f1410}.btn:disabled{opacity:.6}
.btn.c{background:#19b8f0;box-shadow:0 5px 0 #0b6e94}
.err{color:#ff8f8f;font-size:14px;min-height:18px;margin-top:6px}
a{color:#19b8f0}small{font-size:12px;color:#9fb8dc}
#game{width:min(100vw,calc(100vh*9/16));position:relative;touch-action:none}
canvas{width:100%;display:block;border-radius:18px}
#hud{position:absolute;top:8px;right:10px;display:flex;gap:8px;align-items:center;font-weight:800}
#hud button{background:#0a2a5c;color:#fff;border:2px solid #19b8f0;border-radius:12px;font-size:18px;padding:8px 12px}
#drop{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);width:auto;padding:14px 34px;font-size:clamp(18px,5vw,26px)}
#msg{position:absolute;top:13%;left:0;right:0;text-align:center;font-size:clamp(18px,6vw,34px);font-weight:900;text-shadow:0 3px 8px #000;pointer-events:none}
#res{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:5}
.cp{width:120px;height:120px;position:relative;margin:0 auto 6px}
.cp i{position:absolute;left:0;width:120px;height:60px;background:var(--c);border:3px solid #fff8}
.cp .t{top:0;border-radius:60px 60px 0 0;animation:up 1s .4s forwards}.cp .b{bottom:0;border-radius:0 0 60px 60px;animation:dn 1s .4s forwards}
@keyframes up{to{transform:translate(-30px,-50px) rotate(-30deg);opacity:0}}@keyframes dn{to{transform:translate(30px,30px) rotate(25deg);opacity:0}}
.rv{animation:pop .6s 1s both}@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.big{font-size:34px;font-weight:900;margin:0}.cpn{background:#fff;color:#0a2a5c;border-radius:14px;padding:14px;margin:12px 0;font-size:26px;font-weight:900;border:3px dashed #e0312b}
.cpn img{width:100%;border-radius:8px}
.pf{position:fixed;top:-40px;font-size:28px;animation:fall 3s linear forwards;z-index:9;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
body{position:relative}.fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}.fx i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:fl 14s ease-in-out infinite alternate}.fx i:nth-child(1){width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:#1b6fd1}.fx i:nth-child(2){width:38vmax;height:38vmax;right:-12vmax;bottom:-10vmax;background:#e0312b;opacity:.28;animation-delay:-5s}.fx i:nth-child(3){width:26vmax;height:26vmax;left:30%;top:40%;background:#19b8f0;opacity:.18;animation-delay:-9s}@keyframes fl{to{transform:translate(4vmax,3vmax) scale(1.1)}}
.rg{position:relative;z-index:1;width:min(92vw,440px);margin-top:46px;padding:1.5px;border-radius:30px;background:linear-gradient(155deg,#4fd3ff,#1a5fb4 38%,#e0312b 100%);box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 50px rgba(25,184,240,.18);animation:rin .7s cubic-bezier(.2,.8,.2,1) both}@keyframes rin{from{opacity:0;transform:translateY(18px) scale(.97)}}
.rgl{position:absolute;left:50%;top:-46px;transform:translateX(-50%);width:min(250px,78%);height:90px;border-radius:24px;background:linear-gradient(180deg,#14468f,#06285a);padding:14px 20px;box-shadow:0 12px 28px rgba(0,0,0,.5),0 0 0 2px rgba(79,211,255,.8),inset 0 1px 0 rgba(255,255,255,.18);z-index:2;display:flex;align-items:center;justify-content:center}.rgl img{max-width:100%;max-height:100%;object-fit:contain;display:block}.rgl img.hide{display:none}
.rg .in{background:linear-gradient(180deg,rgba(13,52,108,.97),rgba(5,24,56,.99));border-radius:28.5px;padding:64px 24px 20px;text-align:center}
.eyebrow{font:800 12px system-ui;letter-spacing:.34em;text-transform:uppercase;color:#7fdcff;margin-bottom:8px}.rg h1{font-size:clamp(21px,5.4vw,27px);line-height:1.15;letter-spacing:.4px;text-shadow:0 2px 12px rgba(0,0,0,.4)}.rg .sub{margin:8px 0 14px;color:#bcd6f5;font-size:15px}
.steps{display:flex;justify-content:center;gap:5px;margin:0 0 16px;flex-wrap:wrap}.steps span{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#d6e8ff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 9px 4px 4px;white-space:nowrap}.steps b{width:20px;height:20px;border-radius:50%;background:linear-gradient(145deg,#ff5a52,#c9231d);display:flex;align-items:center;justify-content:center;font-size:11px}
.fld{position:relative;margin-top:12px}.fld svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;fill:none;stroke:#6fb8f0;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;transition:stroke .2s}
.rg input{width:100%;padding:16px 16px 16px 52px;border-radius:16px;border:1.5px solid rgba(111,184,240,.35);background:rgba(3,18,44,.75);color:#fff;font-size:18px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}.rg input::placeholder{color:#7f9cc4}.rg input:focus{border-color:#19b8f0;box-shadow:0 0 0 4px rgba(25,184,240,.2);background:rgba(3,22,54,.95)}.fld:focus-within svg{stroke:#19b8f0}
.fld.bad input{border-color:#ff6b6b;box-shadow:0 0 0 4px rgba(255,107,107,.16)}.fld.bad svg{stroke:#ff8f8f}.fld.ok input{border-color:rgba(70,214,140,.7)}.fe{min-height:16px;font-size:12.5px;color:#ff9c9c;text-align:left;padding:3px 6px 0}
.rg .btn{position:relative;overflow:hidden;margin-top:10px;background:linear-gradient(180deg,#f0453e,#c9231d);box-shadow:0 6px 0 #7e100c,0 14px 26px rgba(224,49,43,.35)}.rg .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #7e100c}.rg .btn::after{content:"";position:absolute;top:0;bottom:0;width:36%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:sh 3.4s ease-in-out infinite}@keyframes sh{0%,55%{left:-50%}100%{left:130%}}
.rg .btn:disabled{opacity:.7}.rg .err{text-align:center}.priv{display:block;margin-top:10px;font-size:11px;line-height:1.45;color:#8fb0d8}
@media(max-height:640px){.rg{margin-top:34px}.rg .in{padding-top:56px}.steps{display:none}}@media(prefers-reduced-motion:reduce){.fx i,.rg .btn::after{animation:none}}
</style></head><body>

let ac,mute=false,reg=null,busy=false,last=Date.now();
function snd(f,d,t='sine',v=.12,s=0){if(mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain(),T=ac.currentTime+s;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+d)}catch(e){}}
const QK='bd_queue',BRAND="Butcher's";
const rd=()=>JSON.parse(localStorage.getItem('bd_regs')||'[]');
function persist(){try{const a=rd(),i=a.findIndex(r=>r.id===reg.id);i<0?a.push(reg):a[i]=reg;localStorage.setItem('bd_regs',JSON.stringify(a));return true}catch(e){return false}}
const qg=()=>{try{return JSON.parse(localStorage.getItem(QK)||'[]')}catch(e){return[]}},qs=a=>{try{localStorage.setItem(QK,JSON.stringify(a))}catch(e){}};
async function send(p){try{await fetch(CFG.SHEET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p)});return true}catch(e){return false}}
async function flush(){const a=qg();if(!a.length||!CFG.SHEET)return;const rest=[];for(const p of a)if(!await send(p))rest.push(p);qs(rest)}
async function post(stage){if(!reg)return;persist();if(stage==='result')reg.final=1;const p={stage,id:reg.id,time:reg.time,name:reg.name,phone:reg.phone,brand:reg.brand,attempts:reg.attempts,result:reg.result,prize:reg.prize,code:reg.code};if(!CFG.SHEET)return;if(!await send(p)){const a=qg();a.push(p);qs(a)}}
addEventListener('online',flush);flush();
const code=()=>'BUT-'+Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'🔇':'🔊'};
$('#fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()};
const nm=$('#nm'),ph=$('#ph');$('#priv').textContent=CFG.PRIV;
const mark=(id,msg)=>{$('#f-'+id).classList.toggle('bad',!!msg);$('#f-'+id).classList.toggle('ok',!msg);$('#e-'+id).textContent=msg||''};
const vN=()=>{const v=nm.value.trim().replace(/\s+/g,' ');return v.length<2?'Please enter your full name':/[<>{}\\]/.test(v)?'Please remove special characters':''},vP=()=>{const d=ph.value.replace(/\D/g,'');return d.length<7||d.length>15?'Enter a valid phone number (7–15 digits)':''};
nm.oninput=()=>{if($('#f-n').classList.contains('bad'))mark('n',vN())};ph.oninput=()=>{ph.value=ph.value.replace(/[^\d+\s()-]/g,'');if($('#f-p').classList.contains('bad'))mark('p',vP())};nm.onblur=()=>{if(nm.value)mark('n',vN())};ph.onblur=()=>{if(ph.value)mark('p',vP())};
$('#reg').onsubmit=e=>{e.preventDefault();if(busy)return;const a=vN(),b=vP();mark('n',a);mark('p',b);if(a||b){(a?nm:ph).focus();snd(220,.18,'triangle',.08);return}
 busy=true;$('#go').disabled=true;const d=new Date();reg={id:'G'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),time:d.toLocaleString('en-GB'),iso:d.toISOString(),name:nm.value.trim().replace(/\s+/g,' '),phone:ph.value.trim(),brand:BRAND,attempts:0,result:'',prize:'None',code:''};post('registered');start();setTimeout(()=>{busy=false;$('#go').disabled=false},600)};

const cv=$('#cv'),X=cv.getContext('2d');let S,items,cx,cy,open,t,att,tgt,tries,tm,cur;
const FL=740;
function layout(){items=[];for(let i=0;i<17;i++){const c=i%5===2;items.push({x:140+(i%7)*54+((i/7|0)%2)*22+rnd(-5,5),y:704-(i/7|0)*46,k:c?'c':(Math.random()<CFG.WIN?'w':'l'),side:i%2,r:rnd(-.3,.3)})}
 if(!items.some(o=>o.k==='w')){const o=items.find(o=>o.k==='l');o.k='w'}}
function start(){$('#reg').classList.add('hide');$('#game').classList.remove('hide');tries=0;layout();next();last=Date.now();snd(520,.15,'square',.08);snd(780,.2,'square',.08,.15);requestAnimationFrame(loop)}
function next(){S='move';t=rnd(0,6);cy=100;open=1;att=null;$('#tries').textContent='Tries left: '+(CFG.TRIES-tries);$('#msg').textContent='';$('#drop').classList.remove('hide')}
function drop(){if(S!=='move')return;S='drop';tries++;reg.attempts=tries;$('#drop').classList.add('hide');$('#msg').textContent='';
 const c=items.filter(o=>!o.taken&&Math.abs(o.x-cx)<30).sort((a,b)=>topY(a)-topY(b))[0];tgt=c||null;cur=c?topY(c)-36:680;snd(300,.5,'sawtooth',.06)}
const topY=o=>o.y-(o.k==='c'?21:28);
$('#cv').addEventListener('pointerdown',drop);$('#drop').addEventListener('pointerdown',e=>{e.stopPropagation();drop()});
let pt=performance.now();
function loop(n){if($('#game').classList.contains('hide'))return;const dt=Math.min((n-pt)/1000,.05);pt=n;step(dt);draw();requestAnimationFrame(loop)}
function step(dt){
 if(S==='move'){t+=dt;cx=270+228*Math.sin(t*1.25)}
 else if(S==='drop'){cy+=270*dt;if(cy>=cur){cy=cur;S='grab';tm=0}}
 else if(S==='grab'){tm+=dt;open=Math.max(0,1-tm/.6);if(tm===dt)snd(180,.25,'square',.1);if(tm>=.6){snd(120,.2,'square',.12);if(tgt){tgt.taken=true;att=tgt}S='rise'}}
 else if(S==='rise'){cy-=210*dt;if(att){att.x=cx;att.y=cy+44}if(cy<=100){cy=100;if(att)S='carry';else{snd(200,.4,'sine',.1);$('#msg').textContent='MISSED! 😬';tm=0;S='wait'}}}
 else if(S==='wait'){tm+=dt;if(tm>1.4){tries>=CFG.TRIES?end():next()}}
 else if(S==='carry'){cx=Math.max(65,cx-300*dt);att.x=cx;if(cx<=65){S='rel';tm=0}}
 else if(S==='rel'){tm+=dt;open=Math.min(1,tm/.4);if(tm>.4){att.vy=0;S='fall'}}
 else if(S==='fall'){att.vy+=900*dt;att.y+=att.vy*dt;if(att.y>=FL-10){att.y=FL-10;S='done';snd(260,.15,'triangle',.15);reveal(att)}}}
function end(){reg.result='No pickup';post('result');fin('MISSED OUT!','Better luck next time — thanks for playing with Butcher\'s!')}
function cap(x,y,c1,c2,ic){X.save();X.translate(x,y);const g=X.createRadialGradient(-9,-10,3,0,0,28);g.addColorStop(0,'#fff');g.addColorStop(.35,c1);g.addColorStop(1,c2);X.globalAlpha=.92;X.fillStyle=g;X.beginPath();X.arc(0,0,28,0,7);X.fill();X.globalAlpha=1;X.strokeStyle='#fffb';X.lineWidth=2;X.stroke();X.font='22px serif';X.textAlign='center';X.textBaseline='middle';X.fillText(ic,0,2);X.restore()}
function item(o){if(o.k==='c'){X.save();X.translate(o.x,o.y);X.rotate(o.r);X.fillStyle='#fff';X.fillRect(-40,-23,80,46);X.drawImage(o.side?IM.b:IM.f,-38,-21,76,42);X.restore()}
 else if(o.k==='w')cap(o.x,o.y,'#7dffb0','#0f9d58','✂️');else cap(o.x,o.y,'#d9a0ff','#7a2fd0','🐾')}
const BC=['#ff3b3b','#19b8f0','#ffd23b','#ffffff'];
function bulb(x,y,i,ph,r){const on=((i-ph)%4+4)%4===0;X.save();X.globalAlpha=on?1:.28;X.fillStyle=BC[i%4];if(on){X.shadowColor=BC[i%4];X.shadowBlur=16}X.beginPath();X.arc(x,y,r,0,7);X.fill();X.restore()}
function lights(){const ts=performance.now(),ph=Math.floor(ts/130)%4;
 for(let i=0;i<22;i++){bulb(14+i*24.4,7,i,ph,4);bulb(14+i*24.4,49,i+2,ph,4)}
 for(let i=0,y=76;y<760;i++,y+=26){bulb(7,y,i,ph,4.5);bulb(533,y,i+2,ph,4.5)}
 if(LOGO.complete&&LOGO.naturalWidth){const hh=34,w=hh*LOGO.naturalWidth/LOGO.naturalHeight;X.drawImage(LOGO,270-w/2,11,w,hh)}
 else{X.fillStyle='#fff';X.font='italic 900 26px Georgia,serif';X.textAlign='center';X.fillText("Butcher's",270,38)}
 X.font='18px serif';X.textAlign='center';for(let i=0;i<7;i++){X.globalAlpha=.25+.75*Math.abs(Math.sin(ts/500+i*1.7));X.fillText('✦',40+((i*163+37)%470),110+((i*271)%560))}X.globalAlpha=1}
function draw(){X.clearRect(0,0,540,960);
 let g=X.createLinearGradient(0,0,0,960);g.addColorStop(0,'#0e3f86');g.addColorStop(1,'#061a3d');X.fillStyle=g;X.fillRect(0,0,540,960);
 X.fillStyle='#071d44';X.fillRect(0,0,540,56);X.strokeStyle='#e0312b';X.lineWidth=4;X.strokeRect(2,2,536,52);X.fillStyle='#19b8f0';X.fillRect(0,54,540,4);X.fillStyle='#cfd8e3';X.fillRect(14,58,512,10);
 X.fillStyle='#ffffff10';X.fillRect(14,70,512,690);
 X.fillStyle='#10244a';X.fillRect(120,740,406,20);
 X.fillStyle='#04122b';X.fillRect(14,640,106,120);X.fillStyle='#19b8f0';X.fillRect(14,638,106,5);X.fillStyle='#fff';X.font='700 14px system-ui';X.fillText('PRIZE CHUTE',67,705);
 X.fillStyle='#0a2a5c';X.fillRect(0,760,540,200);X.fillStyle='#19b8f0';X.fillRect(0,760,540,5);X.font='24px serif';for(let i=0;i<6;i++)X.fillText('🐾',45+i*90,800);
 items.forEach(o=>{if(!o.taken)item(o)});if(att)item(att);
 const x=cx||270;X.strokeStyle='#8aa';X.lineWidth=4;X.beginPath();X.moveTo(x,63);X.lineTo(x,cy);X.stroke();
 X.fillStyle='#e0312b';X.fillRect(x-22,58,44,14);X.fillStyle='#cfd8e3';X.beginPath();X.roundRect(x-18,cy-6,36,18,6);X.fill();
 X.strokeStyle='#e8eef7';X.lineWidth=6;X.lineCap='round';X.lineJoin='round';for(const s of[-1,1]){X.beginPath();X.moveTo(x+s*10,cy+10);X.lineTo(x+s*(16+open*24),cy+30);X.lineTo(x+s*(5+open*12),cy+52);X.stroke()}
 X.fillStyle='#ffffff18';X.beginPath();X.moveTo(24,75);X.lineTo(150,75);X.lineTo(70,755);X.lineTo(24,755);X.fill();
 X.save();X.shadowColor='#19b8f0';X.shadowBlur=16;X.strokeStyle='#19b8f0';X.lineWidth=6;X.strokeRect(14,70,512,690);X.restore();lights()}
function conf(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<36;i++){const s=document.createElement('span');s.className='pf';s.textContent=['🐾','⭐','🎉'][i%3];s.style.left=rnd(0,98)+'vw';s.style.animationDelay=rnd(0,1.5)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),5000)}}
function fin(h,m){$('#res').classList.remove('hide');$('#rc').innerHTML=`<p class="big">${h}</p><p>${m}</p><button class="btn" id="ok">FINISH</button>`;$('#ok').onclick=reset}
function reveal(o){const w=o.k!=='l',left=tries<CFG.TRIES;$('#res').classList.remove('hide');const rc=$('#rc');
 reg.result=w?'Won':'Better luck';reg.prize=o.k==='w'?'25% OFF Grooming':o.k==='c'?'UK10 10% coupon':'None';if(w)reg.code=code();persist();if(w||!left)post('result');
 [440,560,700].forEach((f,i)=>snd(f,.25,'triangle',.12,.4+i*.12));
 if(o.k==='c'){rc.innerHTML=`<p class="big rv">YOU'VE WON!</p><div class="cpn rv"><img src="${IM.b.src}" alt="UK10 coupon"></div><button class="btn rv" id="cl">CLAIM YOUR PRIZE</button>`;snd(880,.4,'triangle',.12,1);conf()}
 else{const c=o.k==='w'?'#2ecf7a':'#a24ff0';rc.innerHTML=`<div class="cp" style="--c:${c}"><i class="t"></i><i class="b"></i></div>`+(w?`<div class="rv"><p class="big">YOU'VE WON!</p><div class="cpn">25% OFF GROOMING</div><p>Treat your furry friend to some extra pampering!</p><button class="btn" id="cl">CLAIM YOUR PRIZE</button></div>`:`<div class="rv"><p class="big">OH, SO CLOSE!</p><p style="font-size:22px;font-weight:800">BETTER LUCK NEXT TIME!</p><p>Thanks for playing with Butcher's!</p><button class="btn c" id="${left?'pa':'ok'}">${left?'PLAY AGAIN':'FINISH'}</button></div>`);
  setTimeout(()=>{snd(w?880:300,.4,'triangle',.12);w&&conf()},1000)}
 const cl=$('#cl');if(cl)cl.onclick=()=>{rc.innerHTML=`<p class="big">YOUR CODE</p><div class="cpn" style="letter-spacing:3px">${reg.code}</div><p>Show this code to redeem. Validity, participating outlets and terms are set by the promoter.</p><button class="btn" id="ok">FINISH</button>`;$('#ok').onclick=reset};
 const pa=$('#pa');if(pa)pa.onclick=()=>{$('#res').classList.add('hide');layout();next()};const ok=$('#ok');if(ok)ok.onclick=reset}
function reset(){if(reg&&reg.name&&!reg.final&&reg.attempts>0){reg.result=reg.result||'Abandoned';post('result')}nm.value='';ph.value='';['n','p'].forEach(k=>{$('#f-'+k).classList.remove('bad','ok');$('#e-'+k).textContent=''});$('#res').classList.add('hide');$('#game').classList.add('hide');$('#reg').classList.remove('hide');reg=null;S='x'}
document.addEventListener('pointerdown',()=>last=Date.now());
setInterval(()=>{if(reg&&Date.now()-last>CFG.IDLE*1000&&S!=='fall')reset()},3000);
</script></body></html>
